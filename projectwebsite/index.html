<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>ClassNotes - Feed</title>
  <script src="https://cdn.tailwindcss.com"></script>
</head>
<body class="bg-gray-100 font-sans">

  <nav class="bg-blue-600 text-white p-4 shadow-md sticky top-0 z-10">
    <div class="max-w-2xl mx-auto flex justify-between items-center">
      <h1 class="text-xl font-bold tracking-wide">ClassNotes</h1>
      
      <div class="flex items-center space-x-3">
        <!-- Moderation Button (Only visible for Professors) -->
        <button id="modPanelBtn" class="hidden text-xs bg-purple-700 hover:bg-purple-800 px-3 py-1 rounded-full transition font-semibold">
          🛡️ Appeals & Banned (<span id="appealCount">0</span>)
        </button>
        <span id="navRoleBadge" class="text-xs bg-blue-700 px-3 py-1 rounded-full font-medium">Loading...</span>
        <button id="logoutBtn" class="text-xs bg-red-500 hover:bg-red-600 px-3 py-1 rounded-full transition font-semibold">Logout</button>
      </div>
    </div>
  </nav>

  <main class="max-w-2xl mx-auto mt-6 p-4">
    <div class="bg-white rounded-lg shadow p-4 mb-6">
      
      <div class="flex items-center space-x-3 mb-3">
        <div id="userAvatar" class="w-10 h-10 rounded-full bg-blue-500 text-white flex items-center justify-center font-bold text-lg uppercase">
          U
        </div>
        <div class="flex flex-col">
          <span id="userNameDisplay" class="font-bold text-gray-800">User</span>
          <span id="userRoleDisplay" class="text-xs font-semibold text-gray-500">Role</span>
        </div>
      </div>
      
      <form id="noteForm" class="space-y-3">
        <input type="text" id="noteTitle" placeholder="Subject or Note Title" required
          class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400">
        
        <textarea id="noteContent" rows="3" placeholder="What did you learn in class today?" required
          class="w-full p-2 border rounded-md focus:outline-none focus:ring-2 focus:ring-blue-400 resize-none"></textarea>

        <div class="grid grid-cols-1 md:grid-cols-2 gap-2 text-sm text-gray-600">
          <div>
            <label class="block font-medium mb-1">Attach Image:</label>
            <input type="file" id="imageInput" accept="image/*"
              class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
          </div>
          <div>
            <label class="block font-medium mb-1">Attach Document (PDF, TXT, etc.):</label>
            <input type="file" id="fileInput" accept=".pdf,.doc,.docx,.txt,.ppt,.pptx"
              class="w-full text-xs text-gray-500 file:mr-2 file:py-1 file:px-2 file:rounded-md file:border-0 file:text-xs file:bg-blue-50 file:text-blue-700 hover:file:bg-blue-100">
          </div>
        </div>
        
        <div class="flex justify-end pt-2">
          <button type="submit" 
            class="bg-blue-600 hover:bg-blue-700 text-white font-semibold px-4 py-2 rounded-md transition">
            Post Note
          </button>
        </div>
      </form>
    </div>

    <!-- Feed Container -->
    <div id="feed" class="space-y-4"></div>
  </main>

  <!-- MODERATION MODAL (PROFESSOR ONLY) -->
  <div id="modModal" class="hidden fixed inset-0 bg-black bg-opacity-50 flex items-center justify-center p-4 z-50">
    <div class="bg-white rounded-lg shadow-xl w-full max-w-lg p-6 max-h-[80vh] flex flex-col">
      <div class="flex justify-between items-center mb-4 pb-2 border-b">
        <h3 class="text-lg font-bold text-gray-800">🛡️ Moderation: Ban Appeals</h3>
        <button id="closeModModal" class="text-gray-400 hover:text-gray-600 font-bold text-xl">&times;</button>
      </div>

      <div id="appealsList" class="overflow-y-auto flex-1 space-y-3">
        <!-- Appeals rendered via JavaScript -->
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
